modLoader = "javafml"
loaderVersion = "[47,)"
license = "${mod_license}"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
displayURL = "${mod_url}"
authors = "${mod_author}"
description = '''Continuum: the galaxy map, rockets, missions, outposts and personal dimensions of the Phoenix suite. Works on its own, with or without GregTech (GregTech adds the Launch Complex multiblock); PhoenixCore connects it to Conflux research.'''

[[dependencies.${mod_id}]]
modId = "forge"
mandatory = true
versionRange = "[${forge_major},)"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
mandatory = true
versionRange = "[${minecraft_version},)"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "gtceu"
mandatory = false
versionRange = "[${gtceu_version_min},)"
ordering = "AFTER"
side = "BOTH"

