modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
displayURL = "${mod_url}"
authors = "${mod_author}"
description = '''Continuum: the galaxy map, rockets, missions, outposts and personal dimensions of the Phoenix suite. Works on its own; PhoenixCore connects it to Conflux research.'''

[[dependencies.${mod_id}]]
modId = "neoforge"
type = "required"
versionRange = "[${neo_version},)"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "gtceu"
type = "optional"
versionRange = "[${gtm_version_min},)"
ordering = "AFTER"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "configuration"
type = "required"
versionRange = "[3.1,)"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "phoenix_tesla_network"
type = "optional"
versionRange = "[0.5.0,)"
ordering = "AFTER"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "solaris"
type = "optional"
versionRange = "[1.6.5,)"
ordering = "AFTER"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "emi"
type = "optional"
versionRange = "[1.1.0,)"
ordering = "AFTER"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "infiniverse"
type = "optional"
versionRange = "[1.0,)"
ordering = "AFTER"
side = "BOTH"
