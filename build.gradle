plugins {
    id 'idea'
    id 'maven-publish'
    id 'net.neoforged.moddev.legacyforge' version '2.0.91'
}

version = mod_version
group = mod_group_id

sourceSets.main.resources {
    srcDir 'src/generated/resources'
}

repositories {
    mavenLocal()
    mavenCentral()
    maven {
        name = 'GTCEu Maven'
        url = 'https://maven.gtceu.com'
        content {
            includeGroup 'com.gregtechceu.gtceu'
            includeGroup 'brachy.modularui'
        }
    }
    maven { url = 'https://maven.parchmentmc.org' }
    maven { url = 'https://maven.blamejared.com/' }
    maven {
        url = 'https://maven.tterrag.com/'
        content { includeGroup 'com.tterrag.registrate' }
    }
    maven {
        url = 'https://maven.latvian.dev/releases'
        content {
            includeGroup 'dev.latvian.mods'
            includeGroup 'dev.latvian.apps'
        }
    }
    maven { url = 'https://maven.terraformersmc.com/' }
    maven {
        url = 'https://cursemaven.com/'
        content { includeGroup 'curse.maven' }
    }
    maven { url = 'https://maven.architectury.dev' }
    maven { url = 'https://maven.firstdarkdev.xyz/snapshots/' }
    maven {
        name = 'Repsy'
        url = uri('https://repo.repsy.io/mvn/user75142941/phoenixsuite')
    }
    flatDir {
        dir 'libs'
    }
}

base {
    archivesName = archives_base_name
}

java {
    sourceCompatibility = targetCompatibility = JavaVersion.VERSION_17
}

legacyForge {
    version = project.minecraft_version + '-' + project.forge_version

    parchment {
        mappingsVersion = project.mapping_version
        minecraftVersion = project.minecraft_version
    }

    runs {
        configureEach {
            gameDirectory = file('run')
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
            sourceSet = sourceSets.main
        }
        client {
            client()
        }
        server {
            server()
            programArguments.addAll('--nogui')
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

dependencies {
    compileOnly 'org.jetbrains:annotations:26.0.1'

    // GregTech and what it is built on
    modImplementation("com.gregtechceu.gtceu:gtceu-${minecraft_version}:${gtceu_version}:slim")
    modImplementation("com.lowdragmc.ldlib:ldlib-forge-${minecraft_version}:${ldlib_version}") { transitive = false }
    modImplementation("brachy.modularui:modularui-mc${minecraft_version}:${mui_version}") { transitive = false }
    modImplementation("com.tterrag.registrate:Registrate:${registrate_version}")
    modImplementation "curse.maven:configuration-444699:5840405"
    modImplementation "net.phoenixvine.wiki:phoenix_wiki:0.5.5"

    // PhoenixCore (Conflux research, teams, sounds): the 1.20.1 build, a plain jar in libs/
    compileOnly files('libs/PhoenixCore-1.20.1.jar')
    runtimeOnly files('libs/PhoenixCore-1.20.1.jar')

    modCompileOnly("dev.emi:emi-forge:${emi_version}+${minecraft_version}")
    modRuntimeOnly("dev.emi:emi-forge:${emi_version}+${minecraft_version}")
    modCompileOnly("dev.latvian.mods:kubejs-forge:${kubejs_version}") { transitive = false }
    modCompileOnly("dev.latvian.mods:rhino-forge:${rhino_version}") { transitive = false }
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version: minecraft_version,
            forge_major      : forge_version.split("[.]")[0],
            mod_id           : mod_id,
            mod_name         : mod_name,
            mod_license      : mod_license,
            mod_version      : mod_version,
            mod_author       : mod_author,
            mod_url          : mod_url,
            gtceu_version_min: gtceu_version_min,
    ]
    inputs.properties replaceProperties
    filesMatching('META-INF/mods.toml') {
        expand replaceProperties
    }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs << '-Xmaxerrs' << '10000' << '-Xlint:-deprecation'
}

tasks.named('jar', Jar).configure {
    archiveClassifier.set('slim')
    finalizedBy 'reobfJar'
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifactId = base.archivesName.get()
            from components.java
        }
    }
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
