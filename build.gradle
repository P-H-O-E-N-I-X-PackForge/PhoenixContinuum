plugins {
    id 'idea'
    id 'maven-publish'
    id 'net.neoforged.moddev.legacyforge' version '2.0.91'
}

version = mod_version
group = mod_group_id

sourceSets {
    main.resources {
        srcDir 'src/generated/resources'
    }
    // The parts written for GregTech 8 (compiled against it, shipped in the same jar, only loaded when GregTech 8 is
    // the installed version). Everything else is compiled against GregTech 7.5.3.
    gtm8 {
        java.srcDir 'src/gtm8/java'
    }
}

repositories {
    mavenLocal()
    mavenCentral()
    maven {
        name = 'GTCEu Maven'
        url = 'https://maven.gtceu.com'
        content {
            includeGroup 'com.gregtechceu.gtceu'
            includeGroup 'brachy.modularui'
        }
    }
    maven { url = 'https://maven.parchmentmc.org' }
    maven { url = 'https://maven.blamejared.com/' }
    maven {
        url = 'https://maven.tterrag.com/'
        content { includeGroup 'com.tterrag.registrate' }
    }
    maven {
        url = 'https://maven.latvian.dev/releases'
        content {
            includeGroup 'dev.latvian.mods'
            includeGroup 'dev.latvian.apps'
        }
    }
    maven { url = 'https://maven.terraformersmc.com/' }
    maven { url = 'https://maven.theillusivec4.top/' }
    maven {
        url = 'https://cursemaven.com/'
        content { includeGroup 'curse.maven' }
    }
    maven { url = 'https://maven.architectury.dev' }
    maven { url = 'https://maven.firstdarkdev.xyz/snapshots/' }
    maven {
        name = 'Repsy'
        url = uri('https://repo.repsy.io/mvn/user75142941/phoenixsuite')
    }
    flatDir {
        dir 'libs'
    }
}

base {
    archivesName = archives_base_name
}

java {
    sourceCompatibility = targetCompatibility = JavaVersion.VERSION_17
}

legacyForge {
    version = project.minecraft_version + '-' + project.forge_version

    parchment {
        mappingsVersion = project.mapping_version
        minecraftVersion = project.minecraft_version
    }

    runs {
        configureEach {
            gameDirectory = file('run')
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
            sourceSet = sourceSets.main
        }
        client {
            client()
        }
        server {
            server()
            programArguments.addAll('--nogui')
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
            sourceSet(sourceSets.gtm8)
        }
    }
}

configurations {
    gtm8CompileOnly.extendsFrom(compileOnly, implementation)
}
def gtm8Remapped = obfuscation.createRemappingConfiguration(configurations.gtm8CompileOnly)
sourceSets.gtm8.compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath

dependencies {
    compileOnly 'org.jetbrains:annotations:26.0.1'

    // Compile against GregTech 7.x; the GregTech 8 classes compile in the gtm8 source set.
    modCompileOnly("com.gregtechceu.gtceu:gtceu-${minecraft_version}:${gtceu_version}:slim") { transitive = false }
    modGtm8CompileOnly("com.gregtechceu.gtceu:gtceu-${minecraft_version}:${gtceu8_version}:slim") { transitive = false }
    modGtm8CompileOnly("brachy.modularui:modularui-mc${minecraft_version}:${mui_version}") { transitive = false }
    // Which GregTech the dev client or server runs: 7.x by default, the GT 8 snapshot with -Pgtm=8, or any exact
    // version with -Pgtm=<version> (for example -Pgtm=8.0.0).
    modRuntimeOnly("com.gregtechceu.gtceu:gtceu-${minecraft_version}:${project.findProperty('gtm') == '8' ? gtceu8_version : (project.findProperty('gtm') ?: gtceu_version)}:slim") { transitive = false }
    // The GT 8 snapshot jar-in-jars these (its slim jar leaves them out), so a dev run on it has to provide them.
    if (project.findProperty('gtm') != null) {
        modRuntimeOnly("brachy.modularui:modularui-mc${minecraft_version}:${mui_version}") { transitive = false }
        modRuntimeOnly("io.github.llamalad7:mixinextras-forge:0.5.3")
        modRuntimeOnly("top.theillusivec4.curios:curios-forge:5.9.1+1.20.1")
    }

    modImplementation("com.lowdragmc.ldlib:ldlib-forge-${minecraft_version}:${ldlib_version}") { transitive = false }
    modImplementation("com.tterrag.registrate:Registrate:${registrate_version}")
    modImplementation "curse.maven:configuration-444699:5840405" // Configuration 3.1.0 (GregTech 8 needs 3.1+)
    jarJar(modImplementation("net.phoenixvine.wiki:phoenix_wiki:0.5.5"))

    // Solaris (map markers for launch complexes), optional: a plain jar in libs/
    modCompileOnly "solaris:solaris:1.20.1"

    modCompileOnly("dev.emi:emi-forge:${emi_version}+${minecraft_version}")
    modRuntimeOnly("dev.emi:emi-forge:${project.findProperty('gtm') != null ? '1.1.24' : emi_version}+${minecraft_version}")
    modCompileOnly("dev.latvian.mods:kubejs-forge:${kubejs_version}") { transitive = false }
    modCompileOnly("dev.latvian.mods:rhino-forge:${rhino_version}") { transitive = false }
    // KubeJS in the dev runtime, so the plugin and the example script actually load
    modRuntimeOnly("dev.latvian.mods:kubejs-forge:${kubejs_version}")
    modRuntimeOnly("dev.latvian.mods:rhino-forge:${rhino_version}")
    modRuntimeOnly("dev.architectury:architectury-forge:9.2.14")
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version: minecraft_version,
            forge_major      : forge_version.split("[.]")[0],
            mod_id           : mod_id,
            mod_name         : mod_name,
            mod_license      : mod_license,
            mod_version      : mod_version,
            mod_author       : mod_author,
            mod_url          : mod_url,
            gtceu_version_min: gtceu_version_min,
    ]
    inputs.properties replaceProperties
    filesMatching('META-INF/mods.toml') {
        expand replaceProperties
    }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs << '-Xmaxerrs' << '10000' << '-Xlint:-deprecation'
}

tasks.named('jar', Jar).configure {
    from sourceSets.gtm8.output
    archiveClassifier.set('slim')
    finalizedBy 'reobfJar'
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifactId = base.archivesName.get()
            from components.java
        }
    }
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

// One-click dev runs against newer GregTech, visible under "mod development" in the Gradle tool window.
[['Gtm8', '8', 'the GregTech 8 development snapshot'], ['Gtm8Release', '8.0.0', 'the GregTech 8.0.0 release']].each { suffix, version, label ->
    ['Client', 'Server'].each { side ->
        tasks.register("run${side}${suffix}", GradleBuild) {
            group = 'mod development'
            description = "Runs the dev ${side.toLowerCase()} with ${label} instead of GregTech ${gtceu_version}."
            dir = projectDir
            tasks = ["run${side}".toString()]
            startParameter.projectProperties = [gtm: version]
        }
    }
}
